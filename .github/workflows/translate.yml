# Translates the English content into Portuguese, Chinese and Japanese with
# DeepL and opens a pull request with the result. Runs by hand (Actions >
# "Translate with DeepL" > Run workflow) and on every change to the English
# content on main. The key is the repository secret DEEPL_API_KEY; see
# docs/TRANSLATION.md.
name: Translate with DeepL

on:
  workflow_dispatch:
    inputs:
      force:
        description: Translate every string again (ignores manual fixes)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['src/content/fixtures/en/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node --experimental-strip-types scripts/translate.mts ${{ inputs.force && '--force' || '' }}
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deepl/translations
          commit-message: |
            Machine translations (DeepL) for pt, zh and ja

            Agent: CMS
          title: Machine translations (DeepL) for pt, zh and ja
          body: |
            Generated by the "Translate with DeepL" workflow from the English content.
            Review the copy before merging; manual fixes in content.json are kept
            until the English source of that string changes.
          labels: translations
          add-paths: src/content/fixtures/pt,src/content/fixtures/zh,src/content/fixtures/ja
